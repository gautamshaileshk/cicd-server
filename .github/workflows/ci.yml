name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - run: ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: node --version

      - run: npm ci

      - run: ls node_modules | head -20
